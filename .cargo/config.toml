# Windows builds link the C runtime statically, also for the bundled SQLite that the cc crate compiles, so
# syncup-collector.exe runs without the Visual C++ Redistributable (VCRUNTIME140.dll) installed.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
