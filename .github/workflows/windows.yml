# The local collector on a real Windows machine, which the Mac checks cannot be: the Rust scanner's .exe build,
# file ACLs, the native host launcher through cmd.exe, msvcrt locking and the app itself. Nothing is deployed.
name: windows-collector

on:
  workflow_dispatch:
  push:
    paths: ['*.py', 'ai/**', 'src/**', 'Cargo.toml', 'Cargo.lock', '.cargo/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['*.py', 'ai/**', 'src/**', 'Cargo.toml', 'Cargo.lock', '.cargo/**', '.github/workflows/windows.yml']

permissions:
  contents: read

jobs:
  collector:
    runs-on: windows-2022
    timeout-minutes: 30
    # No PYTHONUTF8: users start app.py in the console's own encoding, so the checks do too.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the Rust scanner
        run: |
          cargo build --release --locked
          New-Item -ItemType Directory -Force bin | Out-Null
          Copy-Item target\release\syncup-collector.exe bin\
          # .cargo/config.toml links the C runtime in; a VCRUNTIME import would need the Visual C++ Redistributable.
          if (Select-String -Path bin\syncup-collector.exe -Pattern 'VCRUNTIME' -SimpleMatch -Quiet) { throw 'syncup-collector.exe still imports VCRUNTIME' }
      # The built scanner, for Windows users who cannot build it themselves (Actions run page → Artifacts).
      - name: Keep the scanner
        uses: actions/upload-artifact@v4
        with:
          name: syncup-collector-windows-x64
          path: bin/syncup-collector.exe
          if-no-files-found: error
      # The whole app as dist/syncup/syncup.exe, for Windows users without Python (windows_bundle.py).
      - name: Package the app
        run: |
          python -m pip install pyinstaller==6.11.1
          python windows_bundle.py
      - name: Keep the packaged app
        uses: actions/upload-artifact@v4
        with:
          name: syncup-windows-x64
          path: dist/syncup/
          if-no-files-found: error
      # Each check is its own step and runs even after a failure, so that one failure does not hide the others.
      - name: Packaged app (run, bundled scanner, board, native host through cmd.exe)
        if: always()
        env:
          SYNCUP_REQUIRE_BUNDLE: '1'
        run: python check_windows_bundle.py
      - name: Windows support (real ACLs, launcher through cmd.exe)
        if: always()
        run: python check_windows_support.py
      - name: Local pipeline and native host connection file
        if: always()
        run: python check_pipeline.py
      - name: Scanner paths, msvcrt lock and OS gates
        if: always()
        run: python check_portability.py
      - name: Codex scanner
        if: always()
        run: python check_scanner.py
      - name: Claude Code scanner
        if: always()
        run: python check_claude.py
      - name: Local app regression (app.py run, child board, HTTP)
        if: always()
        run: python check_integrity.py
