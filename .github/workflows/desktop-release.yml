name: desktop-installers
on:
  workflow_dispatch:
    inputs:
      web_url:
        description: Production web origin (https://...vercel.app)
        required: true
        type: string
      team_api:
        description: Production team API origin (https://...)
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            asset: mac-arm64
          - os: macos-15-intel
            asset: mac-intel
          - os: windows-2022
            asset: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build bundled scanner
        shell: bash
        run: |
          cargo build --release --locked --manifest-path scanner/Cargo.toml
          mkdir -p bin
          if [ "$RUNNER_OS" = Windows ]; then
            cp scanner/target/release/syncup-scanner.exe bin/
          else
            cp scanner/target/release/syncup-scanner bin/
          fi
      - name: Package desktop setup
        shell: bash
        env:
          SYNCUP_BUILD_WEB: ${{ inputs.web_url }}
          SYNCUP_BUILD_API: ${{ inputs.team_api }}
        run: |
          python -m pip install pyinstaller==6.11.1
          python collector/desktop_bundle.py --web-url "$SYNCUP_BUILD_WEB" --team-api "$SYNCUP_BUILD_API" --version "$GITHUB_SHA"
      - name: Validate installer and local setup server
        run: python checks/check_desktop_setup.py
      - name: Validate bundled native host
        run: python checks/check_desktop_bundle.py
      - name: Archive Mac app (preserve executable modes and symlinks)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/desktop/SyncUp.app dist/desktop/SyncUp-${{ matrix.asset }}.zip
      - name: Archive Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/desktop/SyncUp -DestinationPath dist/desktop/SyncUp-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SyncUp-${{ matrix.asset }}
          path: dist/desktop/*.zip
          if-no-files-found: error
      # Publishing/signing is a separate release decision. No credentials or unsigned auto-updates here.
